<!DOCTYPE html>
<!-- [용성] 관리자 비밀번호 입력 화면 /admin/login (사이트 레이아웃과 분리된 독립 화면) -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 확인 | PASS PACE 관리자</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #13284A; color: #18202B;
               font: 15px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 16px; }
        .card { width: 100%; max-width: 380px; background: #fff; border-radius: 12px; padding: 28px 28px 24px; }
        h1 { margin: 0; font-size: 20px; }
        .sub { margin: 4px 0 20px; color: #5E6A7A; font-size: 14px; }
        label { display: block; font-size: 13px; color: #5E6A7A; margin-bottom: 6px; }
        input { width: 100%; font: inherit; border: 1px solid #D9DFE7; border-radius: 6px; padding: 10px 12px; }
        button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 10px;
                 background: #2D5BD8; color: #fff; cursor: pointer; }
        button:hover { background: #2349B5; }
        :focus-visible { outline: 3px solid #8FB0FF; outline-offset: 2px; }
        .msg { margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: #FCEBEA; color: #8A1C13; }
        code { font-size: 13px; }
    </style>
</head>
<body>
<main class="card">
    <h1>관리자 확인</h1>
    <p class="sub">PASS PACE 데이터 수집 관리 화면입니다.</p>
    <p class="msg" th:if="${!configured}">
        관리자 비밀번호가 설정되지 않아 잠겨 있습니다. application-local.yml 에
        <code>passpace.admin.password</code> 를 적고 서버를 다시 시작하세요.
    </p>
    <p class="msg" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/admin/login}" method="post">
        <input type="hidden" name="redirectURL" th:value="${redirectURL}">
        <label for="password">관리자 비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">들어가기</button>
    </form>
</main>
</body>
</html>
