<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASS PACE 화면 개선 전후</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Malgun Gothic",sans-serif;color:#192840;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:32px 20px 60px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px}p{color:#52617a;line-height:1.7}label{display:block;font-weight:700;margin:24px 0 8px}select{font:inherit;min-height:48px;padding:10px 40px 10px 12px;border:1px solid #8190a6;border-radius:12px;background:white;color:#192840;max-width:100%}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}figure{margin:0;min-width:0}figcaption{font-weight:700;margin-bottom:12px}img{display:block;width:100%;height:auto;border:1px solid #e0e6ef;border-radius:16px}a{color:#3155c7}aside{margin-top:32px;border-top:1px solid #e0e6ef;padding-top:12px}@media(max-width:600px){.compare{gap:12px}main{padding:24px 12px}h1{font-size:23px}img{border-radius:10px}}
</style>
<main>
  <h1>학습에 집중하는 PASS PACE</h1>
  <p>오늘 할 과목을 먼저 보고, 계획과 다음 행동을 더 쉽게 확인하도록 정돈했습니다.<br>같은 검증용 서버·초기 자료를 사용하는 에뮬레이터에서 촬영한 화면입니다. 화면의 계정은 검증용이며 실제 사용자 정보가 아닙니다.</p>
  <label for="screen">비교할 화면</label>
  <select id="screen">
    <option value="home">오늘 할 학습</option><option value="login">로그인</option><option value="signup">회원가입</option>
    <option value="plan">계획 목록</option><option value="plan-time">계획 입력 · 시간과 요일</option><option value="plan-exams">계획 입력 · 시험과 기간</option><option value="plan-input">계획 입력 · 과목 이해도</option>
    <option value="preview">계획 미리보기</option><option value="comparison-summary">현재·새 계획 비교</option><option value="comparison">날짜·과목별 변경 상세</option>
    <option value="chat">상담 시작</option><option value="chat-reply">상담 답변</option><option value="profile">내 정보</option><option value="goal">학습 목표 설정</option>
  </select>
  <div class="compare">
    <figure><figcaption>개선 전</figcaption><img id="before" src="before/home.png" alt="오늘 할 학습 개선 전"></figure>
    <figure><figcaption>개선 후</figcaption><img id="after" src="after/home.png" alt="오늘 할 학습 개선 후"></figure>
  </div>
  <aside><p>백엔드·API·계산·저장 동작은 유지했습니다. 계획된 시간만 표시하며, 학습 완료율이나 실제 공부시간을 만들지 않았습니다.</p><p><a href="plan.md">참고 자료와 설계 기준</a> · <a href="report.md">변경 내용·검증·보류 항목</a></p></aside>
</main>
<script>
const choice=document.getElementById('screen');
choice.addEventListener('change',()=>{
  const label=choice.options[choice.selectedIndex].text;
  for(const kind of ['before','after']){
    const picture=document.getElementById(kind);
    picture.src=kind+'/'+choice.value+'.png';
    picture.alt=label+(kind==='before'?' 개선 전':' 개선 후');
  }
});
</script>
</html>
