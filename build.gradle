// =====================================================================
// 패스페이스(PASS PACE) 정보처리기사 실험판 - 빌드 설정 (공통, 혼자 수정 금지)
// IntelliJ: File > Open > 이 폴더(passpace) 선택 → Gradle 프로젝트로 자동 인식
// =====================================================================
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.passpace'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'         // 웹 서버(8080), REST
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'   // 화면(HTML 템플릿)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'        // JdbcTemplate (DB 접속)
    implementation 'org.springframework.boot:spring-boot-starter-validation'  // 입력값 검증(@NotBlank 등)
    // [JWT] 강의안 12주차 기준 — 보안(Spring Security) + JWT 만들기·검증하기
    //   security 안에 BCrypt(비밀번호 해시)도 들어 있어서 예전 spring-security-crypto 한 줄은 뺐다
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'                           // 토큰 만들기·검증 (컴파일에 필요)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'                             // 실제 동작 코드 (실행할 때만)
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'                          // 토큰 내용(JSON) 읽고 쓰기 (실행할 때만)

    // [JWT] Lombok: @Getter, @RequiredArgsConstructor 등 반복 코드를 컴파일할 때 만들어 준다
    //   IntelliJ: Settings > Annotation Processors > Enable annotation processing 체크
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // [JWT] Swagger: http://localhost:8080/swagger-ui.html 에서 API 를 눌러 보며 테스트
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.jsoup:jsoup:1.21.1'                                   // [용성] HTML 본문 추출
    implementation 'org.seleniumhq.selenium:selenium-java'                     // [용성] 티스토리 검색 화면 읽기 (PC 의 크롬 사용, 버전은 Spring Boot 관리)
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'                         // MariaDB 드라이버

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
